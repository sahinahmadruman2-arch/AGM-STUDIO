name: Build Signed Android Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build & Sign AGM Studio Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Verify signing secrets are configured
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Missing Android signing secrets. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in GitHub Repository Secrets."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build web bundle for Capacitor Android
        run: npm run build:android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build unsigned Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Zipalign and sign Release APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -s "$UNSIGNED_APK" ]; then
            echo "Error: Unsigned release APK not found at $UNSIGNED_APK"
            exit 1
          fi

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "$KEYSTORE_B64" | base64 --decode > /tmp/release.keystore

          "$BUILD_TOOLS_DIR/zipalign" -p -f 4 "$UNSIGNED_APK" /tmp/aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks /tmp/release.keystore \
            --ks-pass "env:KEYSTORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "env:KEY_PASS" \
            --out AGM-Studio-release.apk \
            /tmp/aligned.apk

          "$BUILD_TOOLS_DIR/apksigner" verify AGM-Studio-release.apk
          rm -f /tmp/release.keystore /tmp/aligned.apk
          ls -lh AGM-Studio-release.apk

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agm-studio-release-apk
          path: AGM-Studio-release.apk
          retention-days: 90
          if-no-files-found: error

      - name: Publish Signed Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: AGM Studio ${{ github.event.inputs.release_tag || github.ref_name }}
          files: AGM-Studio-release.apk
        env:
          GITHUB_TOKEN: ${{ github.token }}
