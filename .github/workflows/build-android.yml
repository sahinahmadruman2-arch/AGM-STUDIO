name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build AGM Studio Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build web bundle for Capacitor Android
        run: npm run build:android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify generated Debug APK
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: Debug APK not found or empty at $APK_PATH"
            exit 1
          fi
          cp "$APK_PATH" AGM-Studio-debug.apk
          ls -lh "$APK_PATH" AGM-Studio-debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agm-studio-debug-apk
          path: AGM-Studio-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish Debug APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: AGM Studio — Latest Debug APK
          prerelease: true
          make_latest: false
          body: |
            Automated Android Debug APK build for **AGM Studio** (`com.agmstudio.app`).

            **Phone installation:**
            1. Tap `AGM-Studio-debug.apk` below to download on Android.
            2. Open the downloaded `.apk` and allow installation from your browser/Files app if prompted.
          files: AGM-Studio-debug.apk
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Write build summary
        run: |
          {
            echo "### AGM Studio Android Debug Build Complete"
            echo "- Package ID: \`com.agmstudio.app\`"
            echo "- Artifact: \`agm-studio-debug-apk\` (\`AGM-Studio-debug.apk\`)"
            echo "- Release tag: \`debug-latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
